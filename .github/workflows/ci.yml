name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare CI logs
        run: mkdir -p ci-logs

      - name: Ruff
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee ci-logs/ruff.log
          ruff format --check . 2>&1 | tee ci-logs/ruff-format.log

      - name: mypy
        run: |
          set -o pipefail
          mypy 2>&1 | tee ci-logs/mypy.log

      - name: pytest
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=ci-logs/pytest.xml 2>&1 | tee ci-logs/pytest.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-python-${{ matrix.python-version }}
          path: ci-logs/
          if-no-files-found: ignore

  web:
    name: React web
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Test web application
        working-directory: apps/web
        run: npm test

      - name: Build web application
        working-directory: apps/web
        run: npm run build

  agent-regression:
    name: Agent regression gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install AgentQAKit
        run: python -m pip install -e .

      - name: Run frozen baseline
        run: |
          agentqa test run examples/specs/ci-test.yaml \
            --target examples/specs/ci-baseline-target.yaml \
            --artifacts ci-artifacts/baseline \
            --no-trace-receiver

      - name: Run candidate
        run: |
          set +e
          agentqa test run examples/specs/ci-test.yaml \
            --target examples/specs/ci-candidate-target.yaml \
            --artifacts ci-artifacts/candidate \
            --no-trace-receiver
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then exit 2; fi

      - name: Locate run artifacts
        run: |
          echo "BASELINE_RUN=$(find ci-artifacts/baseline/runs -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"
          echo "CANDIDATE_RUN=$(find ci-artifacts/candidate/runs -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"

      - name: Compare and enforce quality gate
        run: |
          mkdir -p ci-artifacts/reports
          agentqa compare "$BASELINE_RUN" "$CANDIDATE_RUN" \
            --output ci-artifacts/reports/comparison.json \
            > ci-artifacts/reports/comparison.txt
          set +e
          agentqa gate evaluate examples/specs/quality-gate.yaml \
            --baseline "$BASELINE_RUN" \
            --result "$CANDIDATE_RUN" \
            --output ci-artifacts/reports/gate-result.json \
            > ci-artifacts/reports/gate.txt 2>&1
          status=$?
          set -e
          cat ci-artifacts/reports/comparison.txt
          cat ci-artifacts/reports/gate.txt
          {
            echo "## AgentQAKit regression gate"
            echo '```text'
            cat ci-artifacts/reports/comparison.txt
            cat ci-artifacts/reports/gate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload AgentQAKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentqa-regression-evidence
          path: ci-artifacts/
          if-no-files-found: error
