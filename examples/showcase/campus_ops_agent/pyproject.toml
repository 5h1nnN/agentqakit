[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-ops-agent"
version = "0.1.0"
description = "A deterministic campus operations agent with intentional defect variants"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["langgraph>=0.2,<2"]

[project.scripts]
campus-ops = "campus_ops_agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<2", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"campus_ops_agent/data" = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

