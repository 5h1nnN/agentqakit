name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare CI logs
        run: mkdir -p ci-logs

      - name: Ruff
        run: |
          set -o pipefail
          ruff check . 2>&1 | tee ci-logs/ruff.log
          ruff format --check . 2>&1 | tee ci-logs/ruff-format.log

      - name: mypy
        run: |
          set -o pipefail
          mypy 2>&1 | tee ci-logs/mypy.log

      - name: pytest
        run: |
          set -o pipefail
          pytest -q --junitxml=ci-logs/pytest.xml 2>&1 | tee ci-logs/pytest.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-python-${{ matrix.python-version }}
          path: ci-logs/
          if-no-files-found: ignore
