[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentqakit"
version = "0.1.0a0"
description = "Fault-injection and regression testing for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "AgentQAKit contributors" },
]
keywords = ["ai", "agents", "testing", "observability", "mutation-testing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation>=0.51b0,<1",
  "opentelemetry-proto>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "regex>=2024.11,<2027",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
instrumentation = [
  "openai>=1,<3",
  "openinference-instrumentation-langchain>=0.1,<1",
  "openinference-instrumentation-openai>=0.1,<1",
  "opentelemetry-instrumentation-httpx>=0.51b0,<1",
]
langgraph = [
  "langgraph>=0.2,<2",
]
dev = [
  "fastapi>=0.115,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6.0.12,<7",
  "types-regex>=2024.11,<2027",
  "uvicorn>=0.30,<1",
]

[project.scripts]
agentqa = "agentqa.cli:app"

[project.urls]
Homepage = "https://github.com/5h1nnN/agentqakit"
Issues = "https://github.com/5h1nnN/agentqakit/issues"
Repository = "https://github.com/5h1nnN/agentqakit"

[tool.setuptools.packages.find]
include = ["agentqa*"]

[tool.setuptools.package-data]
agentqa = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agentqa"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
pretty = true
files = ["agentqa", "tests"]
exclude = ["^artifacts/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: tests that cross process or network boundaries",
  "e2e: end-to-end command-line tests",
]
